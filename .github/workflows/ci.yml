# Build and test on every Ruby and Rails line this gem promises to run on.
#
# The unit specs need no broker and no Rails application, so they run on the
# whole matrix in seconds. Anything that needs a broker is tagged :integration
# and runs in its own job against a service container, once — and that job is
# also the one that generates a real Rails application and boots it, which is
# slow and would learn the same thing four times on a matrix.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # acemq-amqp can release without a commit landing here, and a constraint that
  # has stopped admitting the current release looks exactly like one that still
  # does until somebody checks. A timer is the only thing that looks.
  schedule:
    - cron: '59 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruby ${{ matrix.ruby }}, rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.1 is the floor and 7.1 is the Rails floor. Rails 8 needs Ruby 3.2,
        # which is Rails' constraint rather than one this gem adds, so the
        # combinations that cannot exist are excluded rather than pretended.
        ruby: ['3.1', '3.2', '3.3', '3.4']
        rails: ['7.1', '7.2', '8.0']
        exclude:
          - { ruby: '3.1', rails: '8.0' }

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: bundle exec rspec

      - name: Lint
        run: bundle exec rubocop

  integration:
    name: against a real broker and a real Rails application
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # spec_helper skips everything tagged :integration unless this is set, so
      # the variable is what turns the job on rather than a second config file.
      - name: Test against the broker
        env:
          ACEMQ_TEST_BROKER: amqp://guest:guest@localhost:5672
        run: bundle exec rspec

  docs:
    name: the documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      # The same build the docs workflow runs, on a pull request, so a dead link
      # or a badge that reached a rendered page is found before it is published.
      - name: Render the pages
        run: bundle exec bash .github/scripts/build-docs-site.sh

  tracks-the-release:
    name: the constraint still admits the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than a step in `test`, deliberately -- the same
    # argument the examples repositories make. A dependency that has fallen out of
    # step and a broken gem are different findings and both are worth having: the
    # specs above still run and the generated Rails application still boots
    # whatever this job concludes, so a red X here reads as "the declared
    # dependency has fallen behind the library", never as "we have no idea whether
    # any of this works".
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # No bundle install: nothing here needs the gems, only RubyGems' own
          # version arithmetic, which ships with Ruby.
          bundler-cache: false

      - name: The declared constraint admits the newest release
        # A constraint is a different question from an exact pin, and forcing the
        # two into the same check would make this job wrong.
        #
        # An exact pin names one version, so it goes stale the instant a newer one
        # is released and equality is the whole question. This gemspec does not
        # pin: `~> X.Y` names a *set*, and a set does not go stale because a
        # release appeared -- that is what the pessimistic operator is for.
        # Demanding it be rewritten on every patch release would just be an exact
        # pin with extra punctuation, and it would be a lie to every application
        # that installs this gem, because the constraint is also what Bundler hands
        # them.
        #
        # What a constraint *can* do is stop admitting the current release. `~> 0.7`
        # is correct through all of 0.7.z and becomes a wall the morning 0.8.0
        # ships. Nothing here breaks at that moment, which is the danger: Bundler
        # keeps resolving 0.7.z, this workflow keeps passing, and it keeps proving
        # something about a version the feed no longer serves as current -- while
        # holding every downstream application back to it as well. So the assertion
        # is membership rather than equality: does the declared requirement admit
        # the newest release?
        #
        # Membership is also what makes the jobs above worth reading. Bundler
        # resolves the newest version a constraint admits, so once the newest
        # release is inside it, the specs really are running against it.
        #
        # Both sides are parsed rather than pattern-matched. The gemspec is loaded
        # and the dependency found by name, so reformatting it cannot make this
        # check quietly stop finding anything, and `~>` is evaluated by
        # Gem::Requirement itself -- the same arithmetic Bundler does, rather than
        # a shell guess at what the operator means. The tags come from the library
        # repository rather than the gem feed because git ls-remote needs no token
        # on a scheduled run.
        run: |
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-ruby-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-ruby-amqp, so the constraint could not be checked"
            exit 1
          fi

          ruby -e '
            newest   = Gem::Version.new(ARGV[0])
            path     = Dir["*.gemspec"].first
            spec     = Gem::Specification.load(path)
            dep      = spec && spec.dependencies.find { |d| d.name == "acemq-amqp" }

            if dep.nil?
              puts "::error::#{path || "the gemspec"} declares no dependency on " \
                   "acemq-amqp, so the constraint could not be checked"
              exit 1
            end

            unless dep.requirement.satisfied_by?(newest)
              puts "::error::#{path} declares acemq-amqp \"#{dep.requirement}\" but the " \
                   "newest release is #{newest}, which that constraint does not admit. " \
                   "Edit the add_dependency line for acemq-amqp in #{path} so it covers " \
                   "#{newest} -- until then Bundler resolves an older release here and in " \
                   "every application that installs this gem."
              exit 1
            end

            puts "declared acemq-amqp \"#{dep.requirement}\", which admits #{newest}, the newest release"
          ' "$newest"

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
